name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contribution-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test exclusive reservation state machine
        run: node --test .github/scripts/contribution-claims.test.cjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,documents]"
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Lint
        run: python -m ruff check rynmesh/ tests/

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npx tsc -b
      - name: Build
        run: npm run build

  llm-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Deterministic strict P2P private LLM flow
        run: python scripts/llm_e2e.py run
      - name: Deterministic encrypted-relay private LLM flow
        run: python scripts/llm_e2e.py relay-run
      - name: Deterministic peer-message mailbox flow
        run: python scripts/llm_e2e.py mailbox-run
      - name: Clean up isolated E2E stack
        if: always()
        run: python scripts/llm_e2e.py down

  friend-product-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[documents]"
      - name: First sharing through fresh nodes and an HTTP mailbox
        run: |
          python scripts/friend_product_e2e.py \
            --work-root "$RUNNER_TEMP/friend-product" \
            --output "$RUNNER_TEMP/friend-product-result.json"
      - name: Default mailbox quota and recovery without duplicate messages
        run: |
          python scripts/friend_product_e2e.py --scenario mailbox-quota \
            --work-root "$RUNNER_TEMP/friend-quota" \
            --output "$RUNNER_TEMP/friend-quota-result.json"
      - name: Show bounded acceptance evidence
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/friend-product-result.json"; then
            cat "$RUNNER_TEMP/friend-product-result.json"
          fi
          if test -f "$RUNNER_TEMP/friend-quota-result.json"; then
            cat "$RUNNER_TEMP/friend-quota-result.json"
          fi

  peer-transit-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Three-node direct ICE peer-transit acceptance
        run: |
          python scripts/run_peer_transit_acceptance.py \
            --size-mib 8 --concurrent 3 --timeout 120 \
            --work-root "$RUNNER_TEMP/peer-transit" \
            --output "$RUNNER_TEMP/peer-transit-report.json" \
            --evidence "$RUNNER_TEMP/peer-transit-evidence.json"
          python scripts/audit_peer_transit.py \
            "$RUNNER_TEMP/peer-transit-evidence.json"
          python scripts/audit_peer_transit.py --report --min-concurrent 3 \
            "$RUNNER_TEMP/peer-transit-report.json"
      - name: Persistent worker soak smoke
        run: |
          mkdir -p "$RUNNER_TEMP/peer-transit-soak"
          python scripts/run_peer_transit_soak.py \
            --duration-seconds 10 --interval-seconds 0.5 --payload-kib 4 \
            --work-root "$RUNNER_TEMP/peer-transit-soak" \
            --progress "$RUNNER_TEMP/peer-transit-soak/progress.json" \
            > "$RUNNER_TEMP/peer-transit-soak/stdout.log" \
            2> "$RUNNER_TEMP/peer-transit-soak/stderr.log"
          python scripts/audit_peer_transit.py --soak-report \
            --require-duration-seconds 10 --min-sessions 3 \
            "$RUNNER_TEMP/peer-transit-soak/progress.json"

  packaged-node:
    # The release form: the node must serve its own UI with no dev server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: python -m pip install -e ".[dev]" build
      - run: cd webapp && npm ci && npm run build
      - name: Fold UI into the package and start the node
        run: |
          cp -R webapp/dist rynmesh/webui
          RYNMESH_HOME="$RUNNER_TEMP/node" RYNMESH_AUTO_REGISTER=0 \
            python -m rynmesh.peer_http &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8791/health 2>/dev/null | grep -q peer_id && break
            sleep 0.5
          done
      - name: Verify the packaged node serves the app
        run: |
          curl -fsS http://127.0.0.1:8791/health | grep -q peer_id
          curl -fsS http://127.0.0.1:8791/ | grep -qi "<!doctype html"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/digest)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/assets/nope.js)" = 404

  desktop-compile:
    name: desktop-compile (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build self-contained node sidecar
        run: ./src-tauri/scripts/build-sidecar.sh
      - name: Fetch pinned llama.cpp runtime
        run: ./src-tauri/scripts/fetch-llama-runtime.sh
      - name: Verify bundled runtime starts
        run: ./src-tauri/resources/llama/llama-server --version
      - name: Start bundled node sidecar
        run: |
          sidecar="$(find src-tauri/binaries -type f -name 'rynmesh-peer-*' -print -quit)"
          ./src-tauri/scripts/verify-sidecar.sh "$sidecar"
      - name: Node finds the bundled runtime
        run: |
          sidecar="$(find src-tauri/binaries -type f -name 'rynmesh-peer-*' -print -quit)"
          RYNMESH_LLAMA_DIR="$PWD/src-tauri/resources/llama" \
            ./src-tauri/scripts/verify-sidecar.sh "$sidecar" --check-llm
      - name: Compile desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
