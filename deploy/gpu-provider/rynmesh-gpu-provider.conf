[program:rynmesh-llm-runtime]
command=/opt/rynmesh/app/deploy/gpu-provider/supervisor-wrapper.sh llm-runtime
directory=/opt/rynmesh/app
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/rynmesh/logs/llm-runtime.log
stderr_logfile=/opt/rynmesh/logs/llm-runtime-error.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB

[program:rynmesh-provider-gateway]
command=/opt/rynmesh/app/deploy/gpu-provider/supervisor-wrapper.sh gateway
directory=/opt/rynmesh/app
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/rynmesh/logs/provider-gateway.log
stderr_logfile=/opt/rynmesh/logs/provider-gateway-error.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB

[program:rynmesh-provider-node]
command=/opt/rynmesh/app/deploy/gpu-provider/supervisor-wrapper.sh provider
directory=/opt/rynmesh/app
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/rynmesh/logs/provider-node.log
stderr_logfile=/opt/rynmesh/logs/provider-node-error.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
